apiVersion: automation.cloudbees.io/v1alpha1
kind: action
name: jenkins build actions
inputs:
  integration-name:
    description: 'integration name'
    required: false
    default: ''
  url:  # id of input
    description: 'jenkins url'
    required: false
  username:  # id of input
    description: 'user name'
    required: false
  token:  # id of input
    description: 'token'
    required: false
  job-name:  # id of input
    description: 'job name'
    required: true
  test-type:  # id of input
    description: 'test type'
    default: ''
  test-result-location:  # id of input
    description: 'test result location'
    default: ''
  parameters:  # id of input
    description: 'parameters as json'
    default: '{}'
  treat-unstable-as-success:
    description: 'If true, treat Jenkins UNSTABLE build result as success'
    default: 'false'

outputs:
  jenkins_output:
    value: ${{ steps.invoke-jenkins-job.outputs.jenkins_output_var }}
    description: Jenkins variable output
    
runs:
  using: composite
  steps:
    - id: invoke-jenkins-job
      name: invoke-jenkins-job
      uses: docker://public.ecr.aws/l7o7z1g8/actions/jenkins-actions:main-45f8c453c0ea444edd0f9dd9c512f4f7a2c6650e
      shell: sh
      env:
        CONFIG_JSON: '{"metaInfo":{"integrationName":"${{ inputs.integration-name }}","url":"${{ inputs.url }}","toolType":"JENKINS","username":"${{ inputs.username }}","token":"${{ inputs.token }}","jobName":"${{ inputs.job-name }}","testType":"${{ inputs.test-type }}","fileName":"${{ inputs.test-result-location }}","parameters":${{ inputs.parameters }},"commitId":"${{ cloudbees.scm.sha }}","treatUnstableAsSuccess":"${{ inputs.treat-unstable-as-success }}"}}'
        RUN_ID: ${{ cloudbees.run_id }}
        JOB_ID: ${{ job.id }}
        STEP_ID: ${{step.internal.id}}
        DNS_URL: ${{ cloudbees.api.url }}
        JWT_TOKEN: ${{ cloudbees.api.token }}
      run: |
        set -x
        cd /app
        # Strip newlines that YAML block scalar inputs append to the parameter value
        { set +x; } 2>/dev/null
        IFS=$(printf '\n_'); IFS="${IFS%_}"
        set -f
        set -- $CONFIG_JSON
        unset IFS
        set +f
        _cfg=''
        for _p do _cfg="${_cfg}${_p}"; done
        set -x
        ./jenkins_actions_app invoke -b "$_cfg"
